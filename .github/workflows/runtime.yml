name: IOP runtime
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/iop/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'iop/**'
      - '.github/workflows/runtime.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[agent]' "pymodbus>=3.11,<4" pyserial
      - if: matrix.os == 'ubuntu-latest'
        run: python -m pip install '.[qcodes,opcua,epics]' pyvisa-py pyvisa-sim pymeasure
      # Program and SDK-worker cases need the native executor; one platform builds it on every change.
      - if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release --locked --manifest-path iop/daemon/Cargo.toml
          echo "IOP_EXECD=$PWD/iop/daemon/target/release/iop-execd" >> "$GITHUB_ENV"
      - run: python -m unittest discover -s tests -v
      - run: python -m ai4instruments.iop --version
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: iop-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/*.whl
  clients:
    # The TypeScript client and the browser interface use the same service; run them on every change too.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --manifest-path iop/daemon/Cargo.toml
      - name: Include native executor
        run: mkdir -p src/ai4instruments/iop/bin && cp iop/daemon/target/release/iop-execd src/ai4instruments/iop/bin/
      - run: npm ci && npm test
        working-directory: iop/clients/typescript
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: iop/interface
      - name: Exercise browser workflows
        run: npm test
        working-directory: iop/interface
